type: "csv"
path: "poseGT.csv"

# Options that inform the algorithm where data is saved in the CSV file
csv_options:
  cols:
    time: ["timestamp"]
    position: ["x", "y", "z"]
    orientation: ["qx", "qy", "qz", "qw"]
  col_nums:
    time: [0]
    position: [1, 2, 3]
    orientation: [5, 6, 7, 4]

  # Used to convert timestamps in csv to seconds.
  timescale: 1.0
  
time_tol: 0.05
interp: True
causal: False